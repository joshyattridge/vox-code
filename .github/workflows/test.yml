name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install SoX on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sox
      - name: Install SoX on macOS
        if: runner.os == 'macOS'
        run: brew list sox || brew install sox
      - run: npm ci
      - run: npm run test:all
      - run: npm pack --dry-run
